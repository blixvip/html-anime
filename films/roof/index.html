<!doctype html>
<html lang="en">

        font-display: block;

      html,

        width: 1920px;

        background: #101628;

      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .world,
      .close-world {
        width: 1920px;
        height: 1080px;
        transform-origin: 50% 62%;
      }
      #dip {
        background: #e23b4a;
        z-index: 4;
      }
      .fig,
      .flare,
      #dip {
        opacity: 0;
      }
      .line {

        font-size: 46px;
        font-weight: 500;
        fill: #f0c36a;

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

            <g transform="translate(72,6)">

      </div>

      <div id="dip" class="clip" data-start="5.7" data-duration="0.85" data-track-index="3"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from("#moon", { scale: 0.92, opacity: 0, duration: 0.6, ease: "power2.out", transformOrigin: "50% 50%" }, 0.2);
      tl.from("#rain", { opacity: 0, duration: 0.5, ease: "power1.out" }, 0.15);
      tl.to("#rain", { y: 90, duration: 0.5, ease: "none", repeat: 15 }, 0);
      tl.fromTo(".world", { scale: 1 }, { scale: 1.06, duration: 2.4, ease: "power1.inOut" }, 0.2);
      tl.set("#fig-a", { opacity: 1 }, 0.8);
      tl.set("#fig-a", { opacity: 0 }, 1.6);
      tl.set("#fig-b", { opacity: 1 }, 1.6);
      tl.set("#fig-b", { opacity: 0 }, 2.4);
      tl.set("#fig-reach", { opacity: 1 }, 2.4);
      tl.set("#flare", { opacity: 1 }, 2.5);
      tl.to("#dip", { opacity: 1, duration: 0.25, ease: "power2.in" }, 5.75);
      tl.to("#dip", { opacity: 0, duration: 0.35, ease: "power2.out" }, 6.05);
      tl.from("#line", { y: 24, opacity: 0, duration: 0.4, ease: "power3.out" }, 6.35);
      tl.to("#s2", { opacity: 0, duration: 0.33, ease: "power1.in" }, 7.67);
      window.__timelines = window.__timelines || {};
      window.__timelines["roof"] = tl;
    </script>
  </body>
</html>
