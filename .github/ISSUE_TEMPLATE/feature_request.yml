name: ✨ Feature request
description: Suggest an idea or improvement for html-anime.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome! One thing that won't change: nothing here calls a video
        model — the frames are code. Ideas that keep that property are the ones
        that fit.

        Want to talk something through first? Drop it in the
        [Discord](https://discord.gg/zEB4VjmfSb) or open a
        [Discussion](https://github.com/blixvip/html-anime/discussions).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: When I direct a film, I want to…
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should html-anime do? Sketches, reference frames, or an example manifest help a lot.
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part would this touch?
      options:
        - The shot sheet / colour scripts
        - A new or changed skill
        - The film manifest format
        - The render or assembly pipeline
        - The site
        - Agent support (a new coding tool)
        - Not sure
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to open a pull request for this.
